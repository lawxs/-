<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>LAW — Links oficiais</title>
  <meta name="description" content="Acompanhe as campanhas completas e as lutas sem dano de LAW no YouTube, apoie as lives pelo LivePix e entre na comunidade no Discord.">
  <link rel="canonical" href="https://lawxs.github.io/-/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LAW">
  <meta property="og:title" content="LAW — Links oficiais">
  <meta property="og:description" content="Campanhas do início ao fim e lutas sem dano. Assista às gameplays, acompanhe as lives e entre na comunidade.">
  <meta property="og:url" content="https://lawxs.github.io/-/">
  <meta property="og:image" content="https://lawxs.github.io/-/assets/law-social.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Capa de LAW com o nome em branco abaixo de uma mulher de cabelos escuros, desenhada entre pessoas de terno.">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="./assets/monograma.svg">
  <link rel="preload" href="./assets/tipos/barlow-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./estilo.css?v=2">
  <script src="./compartilhar.js" defer></script>
</head>
<body>
  <a class="pular" href="#plataformas">Pular para os links</a>

  <header class="topo moldura">
    <div class="assinatura">
      <img class="monograma" src="./assets/monograma.svg" alt="" width="72" height="72">
      <span class="assinatura__rotulo">Links oficiais</span>
    </div>
    <button class="compartilhar" id="compartilhar" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="m8.4 10.7 7.3-4.2M8.4 13.2l7.3 4.2"/>
        <circle cx="5.9" cy="12" r="2.7"/><circle cx="18" cy="5.2" r="2.7"/><circle cx="18" cy="18.8" r="2.7"/>
      </svg>
      Compartilhar
    </button>
  </header>

  <main class="pagina moldura">
    <div class="capa">
      <picture class="capa__arte">
        <source type="image/webp" srcset="./assets/arte-700.webp 700w, ./assets/arte-1165.webp 1165w"
                sizes="(min-width: 1440px) 728px, (min-width: 896px) 52vw, (min-width: 704px) 656px, 100vw">
        <img src="./assets/arte-original.jpg" width="1165" height="1536" fetchpriority="high"
             alt="Em uma multidão de terno, uma mulher de cabelos escuros olha por cima do ombro. Desenho em preto e branco.">
      </picture>
    </div>

    <section class="perfil" aria-labelledby="apresentacao">
      <div class="perfil__texto">
        <h1 class="categoria">LAW</h1>
        <h2 class="saudacao" id="apresentacao">Bora jogar?</h2>
        <p class="bio">Gravo campanhas do início ao fim e volto pros chefes até vencer sem tomar um hit.</p>
      </div>

      <nav class="plataformas" id="plataformas" aria-label="Links oficiais" tabindex="-1">
        <ul>
          <li>
            <a class="canal canal--principal" href="https://youtube.com/@leigames" rel="external noopener noreferrer"
               aria-label="YouTube, assistir às gameplays">
              <svg class="icone" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M23.5 6.2a3.02 3.02 0 0 0-2.1-2.14C19.52 3.54 12 3.54 12 3.54s-7.52 0-9.4.52A3.02 3.02 0 0 0 .5 6.2 31.8 31.8 0 0 0 0 12a31.8 31.8 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.1 2.14c1.88.52 9.4.52 9.4.52s7.52 0 9.4-.52a3.02 3.02 0 0 0 2.1-2.14A31.8 31.8 0 0 0 24 12a31.8 31.8 0 0 0-.5-5.8ZM9.6 15.65v-7.3l6.25 3.65-6.25 3.65Z" fill-rule="evenodd"/>
              </svg>
              <span class="canal__nome">YouTube</span>
              <span class="canal__acao">Assistir</span>
            </a>
          </li>
          <li>
            <a class="canal" href="https://livepix.gg/michelx" rel="external noopener noreferrer"
               aria-label="LivePix, apoiar as lives">
              <svg class="icone icone--livepix" viewBox="1111.5 0 161 160" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M1174.23 159.291c-34.36-.046-62.22-27.899-62.26-62.261V38.852c0-2.587 0-8.085 13.18-8.085s13.22 5.255 13.22 8.085V97.03c.02 19.798 16.066 35.84 35.86 35.861h58.18c2.58 0 8.08 0 8.08 13.179s-5.45 13.221-8.08 13.221Z"/>
                <path d="M1208.76 0a62.25 62.25 0 0 1 62.58 61.978l.28 58.137c0 2.628 0 8.086-13.14 8.086s-13.22-5.175-13.22-8.086l-.32-58.137c-.12-19.77-16.16-35.69-35.94-35.658l-58.18.283c-2.63 0-8.08 0-8.08-13.14s5.33-13.22 8.08-13.22Z"/>
                <rect x="1165.34" y="53.205" width="52.71" height="52.72" rx="3.76"/>
              </svg>
              <span class="canal__nome">LivePix</span>
              <span class="canal__acao">Apoiar</span>
            </a>
          </li>
          <li>
            <a class="canal" href="https://discord.gg/gxW4UUSayQ" rel="external noopener noreferrer"
               aria-label="Discord, entrar na comunidade">
              <svg class="icone" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.516c-.21.375-.444.88-.608 1.276a18.27 18.27 0 0 0-5.646 0 13.27 13.27 0 0 0-.616-1.276A19.74 19.74 0 0 0 3.68 4.374C.59 9.046-.25 13.601.17 18.094a19.91 19.91 0 0 0 5.993 3.026 14.61 14.61 0 0 0 1.226-2.076 12.88 12.88 0 0 1-1.929-.92c.163-.12.322-.247.475-.377 3.72 1.73 7.755 1.73 11.43 0 .155.13.314.256.475.378-.616.36-1.27.667-1.931.922.352.729.762 1.424 1.227 2.075a19.8 19.8 0 0 0 5.993-3.026c.495-5.21-.847-9.724-2.832-13.727ZM8.02 15.31c-1.117 0-2.033-1.027-2.033-2.286 0-1.259.897-2.287 2.033-2.287 1.136 0 2.053 1.027 2.033 2.287 0 1.26-.897 2.287-2.033 2.287Zm7.963 0c-1.116 0-2.032-1.027-2.032-2.286 0-1.26.897-2.287 2.032-2.287 1.136 0 2.053 1.027 2.034 2.287 0 1.26-.898 2.287-2.034 2.287Z"/>
              </svg>
              <span class="canal__nome">Discord</span>
              <span class="canal__acao">Entrar</span>
            </a>
          </li>
        </ul>
      </nav>
    </section>
  </main>

  <footer class="rodape moldura">
    <small>© LAW</small>
    <div class="rodape__fim">
      <a href="https://github.com/lawxs/-" rel="external noopener noreferrer" aria-label="GitHub, ver o código do site">GitHub</a>
      <span class="marcas" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
  </footer>

  <dialog id="janela-link" aria-labelledby="titulo-janela">
    <div class="janela__cabecalho">
      <h2 id="titulo-janela">Compartilhar</h2>
      <button class="fechar" id="fechar" type="button" aria-label="Fechar">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><path d="m5 5 14 14M19 5 5 19"/></svg>
      </button>
    </div>
    <label for="endereco">Endereço desta página</label>
    <div class="copiar">
      <input id="endereco" type="url" readonly spellcheck="false" dir="ltr">
      <button id="copiar" type="button">Copiar</button>
    </div>
    <p id="retorno" class="retorno" role="status" aria-live="polite"></p>
  </dialog>
</body>
</html>
